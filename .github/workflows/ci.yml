name: Pulse checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_browser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse_browser_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      SALT_SECRET: ci-only-salt-secret-at-least-32-characters
      CRON_SECRET: ci-only-cron-secret-at-least-32-characters
      ALLOWED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt && pip install --no-deps -e . && alembic upgrade head
        working-directory: backend
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")" npm run test:lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            web/test-results
            web/.lighthouseci
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse_test
      TEST_DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse_test
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock.txt && pip install --no-deps -e .
      - run: ruff check .
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: pytest -q
