[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulse-api"
version = "0.1.0"
description = "The async foundation for Pulse website monitoring."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.10,<3",
  "httpx>=0.28,<1",
  "apscheduler>=3.11,<4",
  "selectolax>=0.3.28,<1",
  "numpy>=2.2,<3",
  "h11>=0.16,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
local = ["pgserver==0.1.4", "psutil>=5.9,<8"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
